# Include INSIDE the existing vinexus.in server block, replacing its existing
# location / and location = /index.html (and location = / if present).
# Keep the existing root, /assets/ and /api/ proxy configuration.
# Routes through the existing /api/ proxy, so no backend port is assumed here.
# Run nginx -t before reloading nginx.

# PWA assets must be served as files, without authentication or SPA fallback.
location ~ ^/(?:admin/)?manifest\.webmanifest$ {
    types { } default_type application/manifest+json;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
}
location = /admin/sw.js {
    types { } default_type application/javascript;
    add_header Cache-Control "no-cache";
    add_header Service-Worker-Allowed "/admin/";
    try_files $uri =404;
}
location = /admin/offline.html {
    add_header Cache-Control "no-cache";
    add_header X-Robots-Tag "noindex";
    try_files $uri =404;
}

location = /sitemap.sxml {
    return 301 /sitemap.xml;
}
location ~ ^/(sitemap(?:-pages|-products-[1-9][0-9]*)?\.xml)$ {
    rewrite ^/(.*)$ /api/seo/$1 last;
}

location = / {
    rewrite ^ /api/share-page?path=/ last;
}

location = /index.html {
    rewrite ^ /api/share-page?path=/ last;
}

location / {
    try_files $uri $uri/ @vinexus_storefront_page;
}

location @vinexus_storefront_page {
    rewrite ^ /api/share-page?path=$uri last;
}
