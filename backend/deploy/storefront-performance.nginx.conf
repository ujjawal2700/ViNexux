# Include INSIDE each storefront server block (HTTPS as well as HTTP).
# Replace existing gzip and /assets/ directives rather than duplicating them.
# Verify with nginx -t, then reload nginx. Does not cache API/account data.
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 5;
gzip_types text/css application/javascript application/json image/svg+xml application/xml application/manifest+json;

# Vite content-hashed files are immutable across deployments.
location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}

# Bundled theme files are public; use a new filename when changing artwork.
location /theme-assets/ {
    expires 7d;
    add_header Cache-Control "public";
    try_files $uri =404;
}
